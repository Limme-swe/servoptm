name: Build

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headroom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / Paper
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile, test, and verify plugin archive
        run: gradle --no-daemon --stacktrace clean check

      - name: Create checksum
        run: |
          cd build/libs
          sha256sum Headroom.jar > Headroom.jar.sha256

      - name: Upload testable plugin
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-${{ github.sha }}
          path: |
            build/libs/Headroom.jar
            build/libs/Headroom.jar.sha256
          if-no-files-found: error
          retention-days: 30
